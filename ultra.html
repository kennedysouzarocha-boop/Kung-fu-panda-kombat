<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KUNG FU PANDA KOMBAT V5</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#fff;font-family:Arial;min-height:100vh;overflow:hidden}
#sel{padding:10px;text-align:center}
h1{font-size:22px;margin:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:10px auto}
.char{border:2px solid #ff2200;border-radius:12px;padding:10px;background:#151a2a}
.char.sel{border-color:#00ff00;box-shadow:0 0 10px #00ff00}
.char div{font-size:30px}
#fightBtn{margin:15px auto;background:#ff0000;color:#fff;border:none;padding:15px 40px;border-radius:30px;font-size:20px;font-weight:bold;display:block}
#game{display:none;flex-direction:column;height:100vh}
#top{height:50px;background:#000;display:flex;align-items:center;justify-content:space-around;padding:5px}
.bar{width:40%;height:20px;background:#333;border-radius:10px;overflow:hidden}
.fill{height:100%;transition:width .2s}
#arena{flex:1;position:relative;background:linear-gradient(#1a2a5a,#0a0e1a)}
#log{position:absolute;top:10px;left:0;right:0;text-align:center;font-weight:bold;text-shadow:0 0 5px #000}
#p1,#p2{position:absolute;bottom:80px;width:60px;height:80px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:40px;transition:all .1s}
#p1{left:20%;background:#ff4400}
#p2{right:20%;background:#0044ff;transform:scaleX(-1)}
#ctrl{height:90px;background:#000;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px}
#ctrl button{background:#222;color:#fff;border:2px solid #444;border-radius:12px;font-size:18px;font-weight:bold}
#ctrl button:active{background:#ff4400}
</style>
</head>
<body>
<div id="sel">
<h1>🐼 KUNG FU PANDA KOMBAT V5 📱</h1>
<div class="grid" id="grid"></div>
<button id="fightBtn">🥊 LUTAR! 🥊</button>
<p style="opacity:.6;margin-top:10px">Escolhe e aperta LUTAR</p>
</div>

<div id="game">
<div id="top"><div class="bar"><div id="hp1" class="fill" style="width:100%;background:#0f0"></div></div><div id="timer">60</div><div class="bar"><div id="hp2" class="fill" style="width:100%;background:#0f0"></div></div></div>
<div id="arena"><div id="log">VAI!</div><div id="p1"></div><div id="p2"></div></div>
<div id="ctrl"><button data-a="l">◀</button><button data-a="r">▶</button><button data-a="u">⬆</button><button data-a="p">SOCO</button><button data-a="k">CHUTE</button></div>
</div>

<script>
const chars=[
{id:'po',e:'🐼',n:'Po'},{id:'tig',e:'🐯',n:'Tigresa'},{id:'shi',e:'🦝',n:'Shifu'},
{id:'tai',e:'🐆',n:'Tai Lung'},{id:'shen',e:'🦚',n:'Shen'},{id:'kai',e:'🐂',n:'Kai'},
{id:'mac',e:'🐒',n:'Macaco'},{id:'vib',e:'🐍',n:'Vibora'},{id:'man',e:'🦗',n:'Mantis'}];
let sel='po',hp1=100,hp2=100,px=20,ex=70,gameOn=false;
const grid=document.getElementById('grid');
chars.forEach(c=>{
 let d=document.createElement('div');d.className='char'+(c.id==sel?' sel':'');d.innerHTML=`<div>${c.e}</div>${c.n}`;
 d.onclick=()=>{sel=c.id;document.querySelectorAll('.char').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};
 grid.appendChild(d);
});
function start(){
 document.getElementById('sel').style.display='none';
 document.getElementById('game').style.display='flex';
 document.getElementById('p1').innerText=chars.find(x=>x.id==sel).e;
 let rnd=chars[Math.floor(Math.random()*chars.length)];
 document.getElementById('p2').innerText=rnd.e;
 gameOn=true;loop();
}
document.getElementById('fightBtn').addEventListener('click',start);
document.getElementById('fightBtn').addEventListener('touchstart',start);

function punch(isP){
 if(!gameOn)return;
 let pEl=document.getElementById('p1'),eEl=document.getElementById('p2');
 let dist=Math.abs(px-ex);
 if(dist<25){
  let dmg=isP?10:15;
  if(isP){pEl.style.transform='translateX(30px)';}
  else{pEl.style.transform='translateY(-20px)';}
  setTimeout(()=>pEl.style.transform='',100);
  hp2-=dmg;document.getElementById('hp2').style.width=hp2+'%';
  document.getElementById('log').innerText=isP?'SOCO! -'+dmg:'CHUTE! -'+dmg;
  if(hp2<=0){document.getElementById('log').innerText='VITORIA!';gameOn=false;setTimeout(()=>location.reload(),2000);}
 }else{document.getElementById('log').innerText='LONGE! Chega mais perto!';}
}
function move(d){
 if(!gameOn)return;
 if(d=='l'&&px>5)px-=5;if(d=='r'&&px<ex-15)px+=5;if(d=='u'){document.getElementById('p1').style.bottom='140px';setTimeout(()=>document.getElementById('p1').style.bottom='80px',300);}
 document.getElementById('p1').style.left=px+'%';
}
document.querySelectorAll('#ctrl button').forEach(b=>{
 let a=b.getAttribute('data-a');
 b.addEventListener('click',()=>{
  if(a=='l'||a=='r'||a=='u')move(a);
  if(a=='p')punch(true);if(a=='k')punch(false);
 });
 b.addEventListener('touchstart',(e)=>{e.preventDefault();if(a=='l'||a=='r'||a=='u')move(a);if(a=='p')punch(true);if(a=='k')punch(false);});
});
