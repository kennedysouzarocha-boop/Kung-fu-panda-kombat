<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kung Fu Panda Kombat V4 Mobile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:radial-gradient(#1a1a2e,#0f0f23);color:#fff;font-family:Arial;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.4em;margin:8px;text-shadow:0 0 15px #ff6b00;text-align:center}
#menu{width:95%;max-width:600px}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.c{background:rgba(255,255,255,0.08);border:2px solid #ff6b00;border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-size:0.9em}
.c:active{transform:scale(0.9);background:rgba(255,107,0,0.3)}
.c span{font-size:2.2em;display:block}
.c.sel{border-color:#00ff88;box-shadow:0 0 15px #00ff88}
#game{display:none;width:100%;max-width:900px;flex-direction:column;align-items:center}
#hud{width:95%;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:rgba(0,0,0,0.7);border-radius:8px;margin:5px 0}
.hp{width:38%;height:18px;background:#333;border-radius:10px;overflow:hidden;border:1px solid #fff}
.hp-fill{height:100%;transition:width 0.2s}
#canvasWrap{position:relative;width:95vw;max-width:800px}
canvas{width:100%;height:55vh;max-height:420px;background:linear-gradient(to bottom,#0a1a3a 0%,#1a3a1a 70%,#0a2a0a 100%);border:3px solid #ff6b00;border-radius:10px;display:block}
#controls{width:95vw;max-width:800px;display:flex;justify-content:space-between;margin-top:8px;gap:5px}
.left,.right{display:flex;gap:6px}
.btn{width:58px;height:58px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:0.8em;user-select:none}
.btn:active{transform:scale(0.9)}
.move{background:rgba(255,255,255,0.15)} .jump{background:rgba(100,180,255,0.4)}
.punch{background:rgba(255,100,100,0.5)} .kick{background:rgba(255,255,0,0.4);color:#000}
.special{background:linear-gradient(orange,red);border-color:gold} .block{background:rgba(100,255,100,0.3)}
.big{padding:10px 20px;background:#ff6b00;border:none;border-radius:8px;color:#fff;font-weight:bold;margin:10px;cursor:pointer}
#msg{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:2.2em;font-weight:bold;text-shadow:0 0 20px #000;display:none;z-index:10;text-align:center}
</style>
</head>
<body>
<h1>🐼 KUNG FU PANDA KOMBAT V4 📱</h1>
<div id="menu">
<div class="chars">
<div class="c sel" data-c="🐼" data-n="Po"><span>🐼</span>Po</div>
<div class="c" data-c="🐯" data-n="Tigresa"><span>🐯</span>Tigresa</div>
<div class="c" data-c="🦝" data-n="Shifu"><span>🦝</span>Shifu</div>
<div class="c" data-c="🐆" data-n="Tai Lung"><span>🐆</span>Tai Lung</div>
<div class="c" data-c="🦚" data-n="Shen"><span>🦚</span>Shen</div>
<div class="c" data-c="🐂" data-n="Kai"><span>🐂</span>Kai</div>
<div class="c" data-c="🐒" data-n="Macaco"><span>🐒</span>Macaco</div>
<div class="c" data-c="🐍" data-n="Vibora"><span>🐍</span>Vibora</div>
<div class="c" data-c="🦗" data-n="Mantis"><span>🦗</span>Mantis</div>
</div>
<button class="big" onclick="startGame()">🥋 LUTAR!</button>
<p style="text-align:center;opacity:0.7;font-size:0.85em">Escolhe seu lutador e aperte LUTAR<br>Mobile com botões na tela</p>
</div>

<div id="game">
<div id="hud">

<div style="font-weight:bold" id="timer">60</div>
