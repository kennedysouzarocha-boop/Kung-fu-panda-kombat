<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KUNG FU PANDA KOMBAT V7</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b1020;color:#fff;font-family:'Poppins',Arial;overflow:hidden}
#menu{height:100vh;background:radial-gradient(#1a2a5a,#0b1020);display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-family:'Bangers';font-size:32px;text-shadow:0 0 10px #ffcc00,3px 3px 0 #000;margin:10px}
h1 span{color:#ffcc00}
.sub{font-size:11px;opacity:.6;letter-spacing:3px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:360px}
.card{background:linear-gradient(145deg,#1e2a4a,#121a30);border:2px solid #2a3a6a;border-radius:16px;padding:10px 6px;text-align:center}
.card.on{border-color:#ffcc00;box-shadow:0 0 18px #ffcc00;background:linear-gradient(145deg,#3a2e0a,#2a2200)}
.card .emo{font-size:38px;display:block}
.card .name{font-size:11px;font-weight:800;margin-top:4px}
#start{margin-top:14px;background:linear-gradient(#ffcc00,#ff8800);color:#000;border:none;padding:14px 50px;border-radius:30px;font-family:'Bangers';font-size:26px;box-shadow:0 4px 0 #aa5500,0 0 20px #ffcc00}
#game{display:none;flex-direction:column;height:100vh;background:linear-gradient(#87ceeb 0%, #1e3a8a 60%, #0a0e1a 100%)}
#hud{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:rgba(0,0,0,.7)}
.life{width:38%;height:20px;background:#222;border:2px solid #fff;border-radius:10px;overflow:hidden}
.life-fill{height:100%;width:100%}
#p1hp{background:linear-gradient(90deg,#ff4400,#ffcc00)}#p2hp{background:linear-gradient(90deg,#00ccff,#0044ff);float:right}
#timer{font-family:'Bangers';font-size:28px;color:#ffcc00}
#arena{flex:1;position:relative}
#floor{position:absolute;bottom:0;width:100%;height:90px;background:linear-gradient(#8b6a3a,#5a3e1a)}
.fighter{position:absolute;bottom:90px;width:80px;height:100px;display:flex;flex-direction:column;align-items:center}
.fighter .char{font-size:70px}
#p1{left:12%}#p2{right:12%;transform:scaleX(-1)}#p2 .char{transform:scaleX(-1)}
#fx{position:absolute;top:30%;width:100%;text-align:center;font-family:'Bangers';font-size:44px;color:#ffcc00;text-shadow:3px 3px 0 #000;opacity:0}
#controls
