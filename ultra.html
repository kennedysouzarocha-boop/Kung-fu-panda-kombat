<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KUNG FU PANDA KOMBAT V6</title>
<style>
body{background:#0a0e1a;color:#fff;font-family:Arial;text-align:center;margin:0}
h1{margin:15px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto;padding:10px}
.c{border:2px solid #f00;border-radius:12px;padding:12px;background:#151a2a;font-weight:bold}
.c.on{border-color:#0f0;box-shadow:0 0 12px #0f0;background:#1a3a1a}
.c span{font-size:32px;display:block}
#lutar{background:#f00;color:#fff;border:none;padding:16px 45px;border-radius:30px;font-size:22px;font-weight:bold;margin:15px}
#game{display:none;flex-direction:column;height:100vh}
#top{display:flex;justify-content:space-between;padding:8px;background:#000;align-items:center}
.bar{width:40%;height:18px;background:#333;border-radius:10px;overflow:hidden}
.fill{height:100%;background:#0f0;width:100%}
#arena{flex:1;position:relative;background:linear-gradient(#1e3a8a,#000)}
#p1,#p2{position:absolute;bottom:90px;width:60px;height:80px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:45px}
#p1{left:15%;background:#ff4400}
#p2{right:15%;background:#0044ff}
#log{position:absolute;top:10px;width:100%;text-align:center;font-weight:bold;font-size:20px}
#ctrl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px;background:#000;height:85px}
#ctrl button{background:#222;color:#fff;border:2px solid #555;border-radius:10px;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<div id="menu">
<h1>🐼 KUNG FU PANDA KOMBAT V6 📱</h1>
<div class="grid">
<div class="c on" onclick="sel='po';mark(this)"><span>🐼</span>Po</div>
<div class="c" onclick="sel='tig';mark(this)"><span>🐯</span>Tigresa</div>
<div class="c" onclick="sel='shi';mark(this)"><span>🦝</span>Shifu</div>
<div class="c" onclick="sel='tai';mark(this)"><span>🐆</span>Tai Lung</div>
<div class="c" onclick="sel='shen';mark(this)"><span>🦚</span>Shen</div>
<div class="c" onclick="sel='kai';mark(this)"><span>🐂</span>Kai</div>
<div class="c" onclick="sel='mac';mark(this)"><span>🐒</span>Macaco</div>
<div class="c" onclick="sel='vib';mark(this)"><span>🐍</span>Vibora</div>
<div class="c" onclick="sel='man';mark(this)"><span>🦗</span>Mantis</div>
</div>
<button id="lutar" onclick="comecar()">🥊 LUTAR! 🥊</button>
<p>Escolhe um e clica LUTAR</p>
</div>

<div id="game">
<div id="top"><div class="bar"><div id="hp1" class="fill"></div></div><div id="time">60</div><div class="bar"><div id="hp2" class="fill"></div></div></div>
<div id="arena"><div id="log">LUTA!</div><div id="p1">🐼</div><div id="p2">🐯</div></div>
<div id="ctrl"><button onclick="anda(-1)">◀</button><button onclick="anda(1)">▶</button><button onclick="pula()">⬆</button><button onclick="golpe(1)">SOCO</button><button onclick="golpe(2)">CHUTE</button></div>
</div>

<script>
let sel='po',hp1=100,hp2=100,x1=15,x2=70,on=false;
function mark(e){document.querySelectorAll('.c').forEach(c=>c.classList.remove('on'));e.classList.add('on');}
function comecar(){
 document.getElementById('menu').style.display='none';
 document.getElementById('game').style.display='flex';
 let emojis={po:'🐼',tig:'🐯',shi:'🦝',tai:'🐆',shen:'🦚',kai:'🐂',mac:'🐒',vib:'🐍',man:'🦗'};
 document.getElementById('p1').innerText=emojis[sel];
 let keys=Object.keys(emojis);let rnd=keys[Math.floor(Math.random()*keys.length)];
 document.getElementById('p2').innerText=emojis[rnd];
 on=true;setInterval(cpu,200);
}
function anda(d){if(!on)return;x1+=d*4;if(x1<2)x1=2;if(x1>60)x1=60;document.getElementById('p1').style.left=x1+'%';}
function pula(){if(!on)return;let p=document.getElementById('p1');p.style.bottom='150px';setTimeout(()=>p.style.bottom='90px',300);}
function golpe(t){
 if(!on)return;
 let dist=Math.abs(x1-x2);
 if(dist<22){
  let dmg=t==1?12:18;hp2-=dmg;document.getElementById('hp2').style.width=hp2+'%';
  document.getElementById('log').innerText=t==1?'SOCO!':'CHUTE!';
  let p=document.getElementById('p1');p.style.transform='scale(1.3)';setTimeout(()=>p.style.transform='',150);
  if(hp2<=0){document.getElementById('log').innerText='VITORIA!';on=false;setTimeout(()=>location.reload(),2000);}
 }else{document.getElementById('log').innerText='CHEGA MAIS PERTO!';}
}
function cpu(){
 if(!on)return;
 let dist=Math.abs(x1-x2);
 if(dist<22&&Math.random()<0.1){hp1-=10;document.getElementById('hp1').style.width=hp1+'%';if(hp1<=0){document.getElementById('log').innerText='DERROTA!';on=false;setTimeout(()=>location.reload(),2000);}}
 else if(dist>22){if(x2>x1)x2-=1;else x2+=1;document.getElementById('p2').style.right=(100-x2-10)+'%';}
}
</script>
</body>
</html>
