<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kung Fu Panda Kombat ULTRA 3.0</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#fff;font-family:Arial;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:10px}h1{font-size:2em;text-shadow:0 0 20px #ff6b00;margin:10px}.menu{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:15px}.char{width:90px;height:110px;background:rgba(255,255,255,0.1);border:2px solid #ff6b00;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.char:hover{transform:scale(1.1);box-shadow:0 0 20px #ff6b00}.char span{font-size:2.5em}.btn{padding:12px 25px;background:#ff6b00;border:none;border-radius:8px;color:#fff;font-weight:bold;font-size:1.1em;cursor:pointer;margin:10px}#game{display:none;width:100%;max-width:800px}canvas{background:#000;border:3px solid #ff6b00;border-radius:10px;width:100%;height:400px;display:block;margin:0 auto}</style>
</head>
<body>
<h1>🐼 KUNG FU PANDA KOMBAT ULTRA 🥋</h1>
<div id="menuScreen">
<div class="menu">
<div class="char"><span>🐼</span>Po</div><div class="char"><span>🐯</span>Tigresa</div><div class="char"><span>🦝</span>Shifu</div><div class="char"><span>🐆</span>Tai Lung</div><div class="char"><span>🦚</span>Shen</div><div class="char"><span>🐂</span>Kai</div><div class="char"><span>🐒</span>Macaco</div><div class="char"><span>🐍</span>Víbora</div><div class="char"><span>🦗</span>Mantis</div>
</div>
<button class="btn" onclick="document.getElementById('menuScreen').style.display='none';document.getElementById('game').style.display='block';loop()">📖 MODO HISTÓRIA</button>
<button class="btn" onclick="document.getElementById('menuScreen').style.display='none';document.getElementById('game').style.display='block';loop()">🕹️ ARCADE</button>
<p style="margin-top:15px;opacity:0.8">9 Lutadores - Teclas A/D mover W pular J soco K chute L especial</p>
</div>
<div id="game"><canvas id="c" width="800" height="400"></canvas><button class="btn" onclick="location.reload()">Voltar</button></div>
<script>let ctx=document.getElementById('c').getContext('2d'),p1={x:100,y:300,hp:100},p2={x:650,y:300,hp:100},keys={},anim=0;window.onkeydown=e=>keys[e.key.toLowerCase()]=true;window.onkeyup=e=>keys[e.key.toLowerCase()]=false;function loop(){anim+=0.05;ctx.clearRect(0,0,800,400);ctx.fillStyle='#1a3a1a';ctx.fillRect(0,350,800,50);ctx.fillStyle='#ff6b00';ctx.font='20px Arial';ctx.fillText('HP:'+Math.floor(p1.hp)+' VS Inimigo HP:'+Math.floor(p2.hp),20,30);ctx.font='60px Arial';ctx.fillText('🐼',p1.x+Math.sin(anim)*5,p1.y);ctx.fillText('🐆',p2.x+Math.cos(anim)*5,p2.y);if(keys['a'])p1.x-=5;if(keys['d'])p1.x+=5;if(keys['w'])p1.y-=10;if(p1.y<300)p1.y+=3;if(p1.y>300)p1.y=300;if(keys['j']){p2.hp-=0.5;ctx.fillStyle='rgba(255,0,0,0.5)';ctx.fillRect(p2.x,p2.y,60,60)}if(keys['k']){p2.hp-=0.7;ctx.fillStyle='rgba(255,255,0,0.5)';ctx.fillRect(p2.x-10,p2.y+20,80,30)}if(keys['l']){p2.hp-=1.5;ctx.fillStyle='#ff6b00';ctx.beginPath();ctx.arc(p2.x+30,p2.y+30,40,0,6.28);ctx.fill()}if(p2.hp<=0){ctx.fillStyle='#00ff00';ctx.font='40px Arial';ctx.fillText('VENCEU! 🎉',250,200);return}requestAnimationFrame(loop)}</script>
</body></html>
