<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kung Fu Panda Kombat</title>
<style>
body{margin:0;background:#111;display:flex;flex-direction:column;align-items:center;color:#fff;font-family:Arial}
h1{color:#ffb300;margin:8px;font-size:22px}
canvas{border:3px solid #ffb300;border-radius:8px;background:#222;max-width:95vw}
#ui{display:flex;gap:15px;margin:8px;font-weight:bold;font-size:14px}
.bar{width:140px;height:18px;background:#333;border:2px solid #fff;border-radius:10px;overflow:hidden}
.fill{height:100%;transition:width 0.2s}
#poFill{background:#ffb300;width:100%}
#enemyFill{background:#ff3333;width:100%}
button{padding:10px 20px;background:#ffb300;border:none;border-radius:8px;font-weight:bold;margin:5px}
</style>
</head>
<body>
<h1>🐼 KUNG FU PANDA KOMBAT 🐯</h1>
<div id="ui">
<div>PO<div class="bar"><div id="poFill" class="fill"></div></div></div>
<div>VS</div>
<div>TAI LUNG<div class="bar"><div id="enemyFill" class="fill"></div></div></div>
</div>
<canvas id="game" width="800" height="400"></canvas>
<div style="margin:10px;text-align:center">
<button onclick="location.reload()">NOVO COMBATE</button><br>
A/D=mover | W=pulo | J=soco | K=especial | L=defesa
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let keys={};
let game={po:{x:100,y:250,w:70,h:90,hp:100,vx:0,vy:0,onGround:true,facing:1,attack:0,attackType:'' ,defending:false},enemy:{x:630,y:250,w:70,h:90,hp:100,vx:0,vy:0,onGround:true,facing:-1,attack:0,cooldown:0}};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function update(){
let p=game.po,en=game.enemy;p.vx=0;p.defending=!!keys['l'];
if(!p.defending){if(keys['a']){p.vx=-4;p.facing=-1}if(keys['d']){p.vx=4;p.facing=1}}
if(keys['w']&&p.onGround){p.vy=-13;p.onGround=false}
if(keys['j']&&p.attack==0){p.attack=15;p.attackType='punch'}
if(keys['k']&&p.attack==0){p.attack=25;p.attackType='special'}
for(let ch of [p,en]){ch.x+=ch.vx;ch.vy+=0.7;ch.y+=ch.vy;if(ch.y>=250){ch.y=250;ch.vy=0;ch.onGround=true}ch.x=Math.max(0,Math.min(730,ch.x));if(ch.attack>0)ch.attack--}
let d=en.x-p.x;en.vx=0;if(Math.abs(d)>90&&en.cooldown<=0){en.vx=d>0?2.5:-2.5;en.facing=d>0?1:-1}
if(Math.abs(d)<80&&en.cooldown<=0&&Math.random()<0.05){en.attack=15;en.cooldown=60}
if(en.cooldown>0)en.cooldown--;
function hit(at,de){if(at.attack==10){let rg=at.attackType=='special'?110:70;let hx=at.facing==1?at.x+at.w:at.x-rg;if(de.x<hx+rg&&de.x+de.w>hx&&Math.abs(de.y-at.y)<60&&!de.defending){let dmg=at.attackType=='special'?22:10;de.hp=Math.max(0,de.hp-dmg);de.vx=at.facing*5;de.vy=-4;document.getElementById(de==p?'poFill':'enemyFill').style.width=de.hp+'%';if(de.hp<=0)setTimeout(()=>alert((de==en?'PO VENCEU! SKADOOSH!':'TAI LUNG VENCEU!')),100)}}}
hit(p,en);hit(en,p);
}
function drawF(ch,isPo){ctx.save();ctx.translate(ch.x+35,ch.y+45);if(ch.facing==-1)ctx.scale(-1,1);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(-30,45,60,8);if(isPo){ctx.fillStyle=ch.defending?'#777':'#f0e6d2';ctx.beginPath();ctx.ellipse(0,10,30,26,0,0,6.28);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(-30,15,10,22);ctx.fillRect(20,15,10,22);ctx.fillStyle='#f0e6d2';ctx.beginPath();ctx.arc(0,-18,22,0,6.28);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-10,-24,6,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(10,-24,6,0,6.28);ctx.fill();if(ch.attack>0){ctx.fillStyle=ch.attackType=='special'?'#ffcc00':'#ffb300';ctx.beginPath();ctx.arc(38,0,ch.attackType=='special'?20:10,0,6.28);ctx.fill()}}else{ctx.fillStyle='#bbb';ctx.fillRect(-22,-28,44,55);ctx.fillStyle='#444';ctx.beginPath();ctx.arc(0,-32,18,0,6.28);ctx.fill();if(ch.attack>0){ctx.fillStyle='#f33';ctx.fillRect(22,-8,18,12)}}ctx.restore()}
function loop(){update();ctx.fillStyle='#3a2a0a';ctx.fillRect(0,0,800,400);ctx.fillStyle='#5a3e1b';ctx.fillRect(0,340,800,60);ctx.fillStyle='#ffd700';ctx.font='bold 16px Arial';ctx.fillText('ARENA DO PALACIO DE JADE',270,20);drawF(game.po,1);drawF(game.enemy,0);requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
