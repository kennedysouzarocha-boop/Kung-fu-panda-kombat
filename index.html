
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kung Fu Panda Kombat PRO - Ultimate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',sans-serif}
body{background:#050505;color:#fff;overflow:hidden}
.top{text-align:center;padding:6px;background:linear-gradient(90deg,#1a1a1a,#2a1a00);border-bottom:2px solid #ffcc00}
.top h1{color:#ffcc00;font-size:18px;text-shadow:0 0 10px #ffcc00}
#wrap{position:relative;width:96vw;max-width:850px;margin:0 auto}
canvas{width:100%;aspect-ratio:2/1;background:#000;border:3px solid #ffcc00;border-radius:14px;display:block}
#hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.bar{width:42%;height:18px;background:#111;border:2px solid #000;border-radius:20px;overflow:hidden}
.fill{height:100%;transition:width .2s}
.n{font-size:12px;font-weight:bold;text-shadow:1px 1px 2px #000}
#mid{position:absolute;top:42px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:3px 14px;border-radius:12px;border:1px solid #ffcc00;font-size:12px}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;font-weight:900;display:none;z-index:6;text-shadow:0 0 12px #000,3px 3px 0 #000}
.screen{position:absolute;inset:0;background:radial-gradient(#1a1200,#000 80%);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;border-radius:14px;padding:16px;text-align:center}
.screen h2{color:#ffcc00;font-size:28px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;width:100%;max-width:400px}
.char{border:2px solid #444;border-radius:12px;padding:8px;background:#111;cursor:pointer}
.char.sel{border-color:#ffcc00;background:#221d00;box-shadow:0 0 12px #ffcc00;transform:scale(1.05)}
.char b{display:block;font-size:13px}
.char span{font-size:11px;opacity:.7}
.btn{background:linear-gradient(#ffcc00,#ff8800);color:#000;border:none;padding:12px 30px;border-radius:28px;font-weight:900;font-size:16px;box-shadow:0 0 15px #ffcc00;cursor:pointer;margin-top:8px}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:96vw;max-width:520px;margin:8px auto}
.controls button{padding:14px 2px;background:#1e1e1e;border:2px solid #333;border-radius:12px;color:#fff;font-weight:bold;font-size:12px}
.controls button:active{background:#ffcc00;color:#000;transform:scale(.95)}
.spec{background:linear-gradient(#ff2200,#aa0000)!important;border-color:#ff5555!important;grid-column:span 2}
.small{font-size:10px;opacity:.6;text-align:center;margin-top:2px}
</style>
</head>
<body>
<div class="top"><h1>🐼 KUNG FU PANDA KOMBAT PRO - 6 LUTADORES + SOM 🔊</h1></div>
<div id="wrap">
<div id="hud"><div style="width:44%"><div class="n"><span id="pName">PO</span> <span id="hp1T">100</span></div><div class="bar"><div id="hp1" class="fill" style="width:100%;background:linear-gradient(90deg,#2ecc71,#27ae60)"></div></div></div><div style="width:44%;text-align:right"><div class="n"><span id="hp2T">100</span> <span id="eName">TIGRESA</span></div><div class="bar" style="margin-left:auto"><div id="hp2" class="fill" style="width:100%;background:linear-gradient(90deg,#e74c3c,#c0392b)"></div></div></div></div>
<div id="mid">PALÁCIO DE JADE - ESCOLHA SEU LUTADOR</div>
<div id="msg"></div>

<div id="selScreen" class="screen">
<h2>ESCOLHA SEU GUERREIRO</h2>
<p style="font-size:13px;opacity:.8">6 lutadores - Cada um com golpe especial diferente!</p>
<div class="grid" id="charGrid"></div>
<h2 style="font-size:18px;margin-top:6px">VS</h2>
<div class="grid" id="charGrid2"></div>
<button class="btn" onclick="startFight()">LUTAR! 🥊🔥</button>
<p class="small">Dica: Liga o som! Tem efeito de soco, chute e SKADOOSH!</p>
</div>

<div id="endScreen" class="screen" style="display:none">
<h2 id="endTitle">VENCEU!</h2>
<p id="endText"></p>
<button class="btn" onclick="toSelect()">JOGAR DE NOVO</button>
</div>

<canvas id="g" width="850" height="425"></canvas>
</div>

<div class="controls">
<button ontouchstart="k['a']=1" ontouchend="k['a']=0" onmousedown="k['a']=1" onmouseup="k['a']=0">◀️</button>
<button ontouchstart="k['d']=1" ontouchend="k['d']=0" onmousedown="k['d']=1" onmouseup="k['d']=0">▶️</button>
<button ontouchstart="k['w']=1" ontouchend="k['w']=0" onmousedown="k['w']=1" onmouseup="k['w']=0">PULO</button>
<button ontouchstart="k['j']=1" ontouchend="k['j']=0" onmousedown="k['j']=1" onmouseup="k['j']=0">SOCO 👊</button>
<button ontouchstart="k['k']=1" ontouchend="k['k']=0" onmousedown="k['k']=1" onmouseup="k['k']=0">CHUTE 🦶</button>
<button class="spec" ontouchstart="k['l']=1" ontouchend="k['l']=0" onmousedown="k['l']=1" onmouseup="k['l']=0">ESPECIAL 🔥 SKADOOSH</button>
</div>

<script>
const cvs=document.getElementById('g'),ctx=cvs.getContext('2d');
let k={},down={},parts=[],shake=0,stop=0,game='select',selP='po',selE='tigresa';
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
function beep(f,t,v=0.3,type='sine'){initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+t);o.start();o.stop(audioCtx.currentTime+t);}
function sfx(type){initAudio();if(type=='punch'){beep(180,0.15,0.5,'square');setTimeout(()=>beep(90,0.1,0.4,'square'),30)}else if(type=='kick'){beep(120,0.25,0.5,'sawtooth')}else if(type=='special'){beep(200,0.1,0.6,'sawtooth');setTimeout(()=>beep(400,0.15,0.6,'square'),80);setTimeout(()=>beep(800,0.4,0.5,'sine'),150);}else if(type=='hit'){beep(70,0.2,0.4,'square')}else if(type=='win'){beep(300,0.2,0.3);setTimeout(()=>beep(450,0.2,0.3),150);setTimeout(()=>beep(600,0.4,0.4),300)}}
const CHARS={
po:{name:'PO',emoji:'🐼',color:'#f0f0f0',hp:130,power:18,desc:'Panda - Equilibrado'},
tigresa:{name:'TIGRESA',emoji:'🐯',color:'#ff8c00',hp:110,power:22,desc:'Veloz e forte'},
tailung:{name:'TAI LUNG',emoji:'🐆',color:'#777',hp:120,power:25,desc:'Chefe - Muito forte'},
shifu:{name:'SHIFU',emoji:'🦝',color:'#d2b48c',hp:90,power:20,desc:'Mestre - Rápido'},
shen:{name:'LORD SHEN',emoji:'🦚',color:'#fff',hp:100,power:26,desc:'Final - Poder mortal'},
macaco:{name:'MACACO',emoji:'🐒',color:'#8b4513',hp:95,power:21,desc:'Ágil'}
};
function buildGrid(){let g1=document.getElementById('charGrid'),g2=document.getElementById('charGrid2');let html='';for(let id in CHARS){let c=CHARS[id];html+=`<div class="char ${id==selP?'sel':''}" onclick="pick('p','${id}')"><div style="font-size:26px">${c.emoji}</div><b>${c.name}</b><span>${c.desc}</span></div>`}g1.innerHTML=html;let html2='';for(let id in CHARS){let c=CHARS[id];html2+=`<div class="char ${id==selE?'sel':''}" onclick="pick('e','${id}')"><div style="font-size:26px">${c.emoji}</div><b>${c.name}</b><span>${c.desc}</span></div>`}g2.innerHTML=html2;}
function pick(side,id){if(side=='p')selP=id;else selE=id;buildGrid();sfx('punch');}
buildGrid();
let P,E;
function makeFighter(id,x){let d=CHARS[id];return{x,y:300,w:74,h:92,hp:d.hp,mhp:d.hp,vx:0,vy:0,f:x<400?1:-1,a:0,at:0,cd:0,hit:0,id}}
function resetFight(){P=makeFighter(selP,140);E=makeFighter(selE,620);parts=[];document.getElementById('pName').innerText=CHARS[selP].name;document.getElementById('eName').innerText=CHARS[selE].name;hpBar();document.getElementById('mid').innerText=`${CHARS[selP].name} VS ${CHARS[selE].name} - PALÁCIO DE JADE`}
function hpBar(){document.getElementById('hp1').style.width=(P.hp/P.mhp*100)+'%';document.getElementById('hp2').style.width=(E.hp/E.mhp*100)+'%';document.getElementById('hp1T').innerText=Math.floor(P.hp);document.getElementById('hp2T').innerText=Math.floor(E.hp);}
function say(t,c="#ffcc00",tm=1200){let m=document.getElementById('msg');m.innerHTML=t;m.style.color=c;m.style.display='block';setTimeout(()=>m.style.display='none',tm)}
function sp(x,y,co,n=12){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*12,vy:(Math.random()-1)*10,co,life:26})}
function atk(o,t){if(o.cd>0||o.at>0||o.hp<=0)return;o.at=t=='k'?14:t=='s'?32:10;o.a=t=='s'?3:t=='k'?2:1;o.cd=t=='s'?60:22;if(t=='p')sfx('punch');if(t=='k')sfx('kick');if(t=='s'){sfx('special');say(o==P?"SKADOOSH! 💥":"FÚRIA!",o==P?'#ffcc00':'#ff3333',700);sp(o.x+o.w/2,o.y+30,o==P?'#ffcc00':'#ff2222',18)}}
function hurt(v,a,dm){if(v.hit>0)return;v.hp=Math.max(0,v.hp-dm);v.hit=14;v.vx=(v.x<a.x?-1:1)*(dm>18?11:6);v.vy=-6;sp(v.x+v.w/2,v.y+40,dm>18?'#ff0000':'#ffff00',dm>18?18:9);shake=dm>18?16:7;stop=dm>18?8:3;sfx('hit');hpBar();
if(v.hp<=0){game='end';setTimeout(()=>{document.getElementById('endScreen').style.display='flex';if(v==E){document.getElementById('endTitle').innerText=`${CHARS[selP].name} VENCEU! 🏆`;document.getElementById('endText').innerText=`${CHARS[selP].emoji} ${CHARS[selP].name} derrotou ${CHARS[selE].name}! SKADOOSH!`;sfx('win');}else{document.getElementById('endTitle').innerText=`DERROTA...`;document.getElementById('endText').innerText=`${CHARS[selE].name} venceu! Tente de novo, Dragão Guerreiro!`;}},600)}}
function drawChar(o){ctx.save();ctx.translate(o.x+o.w/2,o.y+o.h/2);ctx.scale(o.f,1);if(o.hit>0&&o.hit%4<2)ctx.globalAlpha=.45;
// sombra
ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,o.h/2-4, o.w/2.2, 8, 0,0,Math.PI*2);ctx.fill();
let d=CHARS[o.id];
// corpo base
let bodyCol=o.a==3?'#ffaa00':d.color;
ctx.fillStyle=bodyCol;ctx.beginPath();ctx.ellipse(0,8, o.w/2.1, o.h/2.3, 0,0,Math.PI*2);ctx.fill();
// detalhes por personagem
if(o.id=='po'){ctx.fillStyle='#111';ctx.fillRect(-o.w/2+6,-8,16,34);ctx.fillRect(o.w/2-22,-8,16,34);ctx.fillStyle='#111';ctx.fillRect(-18,o.h/2-12,18,16);ctx.fillRect(0,o.h/2-12,18,16);}
if(o.id=='tigresa'){ctx.strokeStyle='#000';ctx.lineWidth=3;for(let i=-2;i<3;i++){ctx.beginPath();ctx.moveTo(-o.w/2+10,i*9);ctx.lineTo(o.w/2-10,i*9+3);ctx.stroke();}ctx.fillStyle='#1a5c1a';ctx.fillRect(-o.w/2+8, -4, o.w-16, 28);}
if(o.id=='tailung'){ctx.fillStyle='#333';ctx.fillRect(-o.w/2+4,-12,o.w-8,10);ctx.fillStyle='#4a0000';ctx.fillRect(-o.w/2+6,4,o.w-12,18);}
if(o.id=='shen'){ctx.fillStyle='#c00';ctx.fillRect(-14,-26,28,7);ctx.fillStyle='#fff';ctx.fillRect(-2,-34,4,14);}
// cabeça
ctx.fillStyle=o.id=='po'?'#fff':d.color;ctx.beginPath();ctx.arc(0,-o.h/2-6,28,0,Math.PI*2);ctx.fill();
if(o.id=='po'){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-15,-o.h/2-20,10,0,Math.PI*2);ctx.arc(15,-o.h/2-20,10,0,Math.PI*2);ctx.fill();}
ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-10,-o.h/2-6,6,0,Math.PI*2);ctx.arc(10,-o.h/2-6,6,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-o.h/2-8,2.5,0,Math.PI*2);ctx.arc(12,-o.h/2-8,2.5,0,Math.PI*2);ctx.fill();
// braço ataque
if(o.at>0){ctx.fillStyle=o.a==3?'#ffcc00':'#ff7733';let ext=o.at>7?48:20;ctx.fillRect(o.w/2-6,-4,ext,16);ctx.fillStyle=o.a==3?'#ff3300':'#ffaa00';ctx.beginPath();ctx.arc(o.w/2+ext+2,4,10,0,Math.PI*2);ctx.fill();}
ctx.restore();}
function drawBg(){let g=ctx.createLinearGradient(0,0,0,380);g.addColorStop(0,'#87ceeb');g.addColorStop(0.4,'#ffd7a0');g.addColorStop(1,'#c9a86a');ctx.fillStyle=g;ctx.fillRect(0,0,850,380);
ctx.fillStyle='#7a3a00';ctx.fillRect(0,0,60,380);ctx.fillRect(790,0,60,380);
ctx.fillStyle='#8b0000';ctx.fillRect(0,0,12,380);ctx.fillRect(838,0,12,380);
ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(80,30,12,120);ctx.fillRect(760,30,12,120);
ctx.fillStyle='#d8b070';ctx.fillRect(0,350,850,30);ctx.fillStyle='#000';ctx.fillRect(0,378,850,6);
// cerejeira
ctx.fillStyle='#5a2a0a';ctx.beginPath();ctx.moveTo(100,0);ctx.lineTo(120,0);ctx.lineTo(160,120);ctx.lineTo(140,120);ctx.fill();
ctx.fillStyle='#ff9ebf';for(let i=0;i<20;i++){ctx.beginPath();ctx.arc(100+Math.random()*80, Math.random()*80+10, 3+Math.random()*5,0,Math.PI*2);ctx.fill();}}
function upd(o,en,isAI){if(o.hp<=0||game!='fight')return;if(o.y>=300){o.vy=0;o.y=300;}else o.vy+=1.15;o.x+=o.vx;o.y+=o.vy;o.vx*=.86;if(o.x<12)o.x=12;if(o.x>760)o.x=760;
if(o.at>0){o.at--;if(o.at==0)o.a=0;}if(o.cd>0)o.cd--;if(o.hit>0)o.hit--;
if(o.at>0&&o.at<8){let ax=o.f==1?o.x+o.w:o.x-48;let ay=o.y+24;if(ax<en.x+en.w&&ax+48>en.x&&ay<en.y+en.h&&ay+26>en.y){let dm=o.a==3?CHARS[o.id].power+6:o.a==2?CHARS[o.id].power-2:CHARS[o.id].power-8;hurt(en,o,dm);}}
if(isAI&&E.hp>0){let d=E.x-P.x;if(Math.abs(d)>100){E.vx+=d>0?-.8:.8;E.f=d>0?-1:1;}else if(Math.random()<.04){atk(E,Math.random()<.35?'s':Math.random()<.5?'k':'p');}if(Math.random()<.05&&E.y>=300)E.vy=-14;}}
function toSelect(){document.getElementById('endScreen').style.display='none';document.getElementById('selScreen').style.display='flex';game='select';buildGrid();}
function startFight(){initAudio();document.getElementById('selScreen').style.display='none';game='fight';resetFight();say("ROUND 1 - LUTEM!", "#ffcc00", 1000);sfx('special');}
function loop(){requestAnimationFrame(loop);if(stop>0){stop--;return;}ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.5)shake=0;}
drawBg();if(game!='select'){drawChar(E);drawChar(P);for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.36;p.life--;ctx.fillStyle=p.co;ctx.fillRect(p.x,p.y,7,7);if(p.life<=0)parts.splice(i,1);}
if(game=='fight'){if(P.hp>0){if(k['a']){P.vx-=.96;P.f=-1}if(k['d']){P.vx+=.96;P.f=1}if(k['j']&&!down['j']){atk(P,'p');down['j']=1}if(k['k']&&!down['k']){atk(P,'k');down['k']=1}if(k['l']&&!down['l']){atk(P,'s');down['l']=1}for(let i in k)if(!k[i])down[i]=0;}
upd(P,E,false);upd(E,P,true);}}ctx.restore();}
loop();
</script>
</body>
</html>
