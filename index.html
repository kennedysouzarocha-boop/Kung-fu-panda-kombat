
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Kung Fu Panda Kombat ULTRA 3.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',Arial}
body{background:#050505;color:#fff;overflow:hidden}
.top{padding:6px;background:linear-gradient(90deg,#1a1a1a,#2a0000);border-bottom:2px solid #ffcc00;text-align:center}
.top h1{color:#ffcc00;font-size:15px;letter-spacing:1px}
#wrap{position:relative;width:98vw;max-width:900px;margin:4px auto}
canvas{width:100%;aspect-ratio:16/9;background:#000;border:3px solid #ffcc00;border-radius:16px;display:block;box-shadow:0 0 20px rgba(255,204,0,.3)}
#hud{position:absolute;top:6px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.hpbox{width:45%}
.hp-row{display:flex;align-items:center;gap:6px}
.port{width:36px;height:36px;background:#111;border:2px solid #ffcc00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.bar{flex:1;height:16px;background:#111;border:2px solid #000;border-radius:20px;overflow:hidden}
.fill{height:100%;transition:width .15s}
.n{font-size:11px;font-weight:900;text-shadow:1px 1px 2px #000;margin-top:2px}
#mid{position:absolute;top:48px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:4px 14px;border-radius:20px;border:1px solid #ffcc00;font-size:11px;z-index:5}
#msg{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);font-size:42px;font-weight:900;display:none;z-index:8;text-shadow:0 0 16px #000,4px 4px 0 #000;text-align:center}
.screen{position:absolute;inset:0;background:radial-gradient(ellipse at center,#1f1200 0%,#000 78%);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;border-radius:16px;padding:10px;text-align:center;overflow-y:auto}
.screen h2{color:#ffcc00;font-size:24px;text-shadow:0 0 10px #ffcc00}
.modes{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;justify-content:center}
.mode{border:2px solid #444;border-radius:12px;padding:10px 14px;background:#111;cursor:pointer;min-width:110px}
.mode.sel{border-color:#ffcc00;background:#221a00;box-shadow:0 0 12px #ffcc00}
.btn{background:linear-gradient(#ffcc00,#ff8800);color:#000;border:none;padding:12px 32px;border-radius:28px;font-weight:900;font-size:15px;box-shadow:0 0 18px #ffcc00;cursor:pointer;margin-top:8px}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:98vw;max-width:560px;margin:6px auto}
.controls button{padding:12px 2px;background:#1e1e1e;border:2px solid #333;border-radius:10px;color:#fff;font-weight:800;font-size:11px}
.controls button:active{background:#ffcc00;color:#000}
.spec{background:linear-gradient(#ff2200,#aa0000)!important;border-color:#ff5555!important;grid-column:span 2}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0;width:100%;max-width:420px}
.char{border:2px solid #333;border-radius:12px;padding:6px;background:linear-gradient(#111,#0a0a0a);cursor:pointer}
.char.sel{border-color:#ffcc00;background:linear-gradient(#2a2000,#1a1400);box-shadow:0 0 14px #ffcc00;transform:scale(1.04)}
</style>
</head>
<body>

<div id="wrap">

<div class="hpbox"><div class="hp-row"><div class="port" id="pPort">🐼</div><div class="bar"><div id="hp1" class="fill" style="width:100%;background:linear-gradient(90deg,#2ecc71,#0a5)"></div></div></div><div class="n" id="pName">PO</div></div>
<div class="hpbox" style="text-align:right"><div class="hp-row" style="justify-content:flex-end"><div class="bar"><div id="hp2" class="fill" style="width:100%;background:linear-gradient(90deg,#e74c3c,#900)"></div></div><div class="port" id="ePort">🐯</div></div><div class="n" id="eName">TIGRESA</div></div>
</div>
<div id="mid">ULTRA 3.0</div><div id="msg"></div>
<div id="modeScreen" class="screen">

</div>
<div id="selScreen" class="screen" style="display:none">

<div id="endScreen" class="screen" style="display:none">

<button class="btn" style="background:#222;color:#fff;box-shadow:none" onclick="toMode()">MENU</button>
</div>
<canvas id="g" width="900" height="506"></canvas>
</div>

</div>
